<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Poker Club - Caixas & Jogadores</title>
  <style>
    body { font-family: sans-serif; background: #0e1e13; color: #fff; padding: 20px; max-width: 900px; margin: auto; }
    h2 { color: #ffd700; text-align: center; margin-bottom: 15px; }
    
    /* Navegação por Abas */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #2a4733; padding-bottom: 10px; }
    .tab-btn { background: #1a2e20; color: #aaa; border: 1px solid #2a4733; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .tab-btn.active { background: #ffd700; color: #000; border-color: #ffd700; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Cards e Caixas */
    .summary-cards { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .card { flex: 1; min-width: 180px; padding: 12px; background: #1a2e20; border-radius: 6px; border: 1px solid #2a4733; text-align: center; }
    .card h4 { margin: 0 0 5px 0; font-size: 0.9rem; color: #aaa; }
    .card .val { font-size: 1.2rem; font-weight: bold; }
    .val-caixa { color: #51cf66; }
    .val-vale { color: #ff6b6b; }

    .search-box { background: #142419; padding: 12px; border-radius: 6px; border: 1px solid #ffd700; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search-box select { flex: 1; min-width: 200px; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #0e1e13; color: #fff; }
    .search-result { font-weight: bold; font-size: 1.1rem; color: #ffd700; }

    .top-actions { display: flex; justify-content: flex-end; margin-bottom: 15px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select { padding: 8px; border-radius: 4px; border: 1px solid #333; background: #1a2e20; color: #fff; }
    input[type="text"] { flex: 2; min-width: 150px; }
    input[type="number"] { flex: 1; min-width: 80px; }
    input[type="date"] { flex: 1; min-width: 130px; }
    select { flex: 1; min-width: 150px; }
    button { background: #ffd700; color: #000; border: none; padding: 8px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .btn-cancel { background: #6c757d; color: #fff; display: none; }
    .btn-print-all { background: #17a2b8; color: #fff; }
    .btn-print-row { background: #ffc107; color: #000; padding: 4px 8px; font-size: 0.8rem; margin-right: 4px; }
    .btn-edit { background: #17a2b8; color: #fff; padding: 4px 8px; font-size: 0.8rem; margin-right: 4px; }
    .btn-del { background: #8b0000; color: #fff; padding: 4px 8px; font-size: 0.8rem; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #2a4733; padding: 8px; text-align: left; }
    th { background: #1a2e20; color: #ffd700; }
    .badge-vale { color: #ff6b6b; font-weight: bold; }
    .badge-dinheiro { color: #51cf66; font-weight: bold; }
    .badge-cartao { color: #4dabf7; font-weight: bold; }
    .badge-pix { color: #cc5de8; font-weight: bold; }
    .badge-paga-vale { color: #fcc419; font-weight: bold; }
    .badge-devolucao { color: #ff922b; font-weight: bold; }
    #print-area { display: none; }

    /* Estilo de Impressão */
    @media print {
      @page { margin: 0; }
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { 
        display: block !important; 
        position: absolute; left: 0; top: 0; color: #000; 
        font-family: 'Courier New', Courier, monospace; font-weight: bold; 
        width: 80mm; font-size: 12pt;
      }
      .ticket { padding: 8px; text-align: center; }
      .ticket h2 { font-size: 18pt; color: #000; margin: 5px 0; text-transform: uppercase; }
      .ticket h3 { font-size: 14pt; color: #000; margin: 5px 0; }
      .ticket-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 11pt; }
      .line { border-bottom: 2px solid #000; margin: 10px 0; }
      .valor-destaque { font-size: 16pt; margin: 10px 0; border: 2px solid #000; padding: 6px; }
      .cut-space { height: 80px; display: block; }
    }
  </style>
</head>
<body>

  <h2>♣ Poker Club - Caixas & Jogadores</h2>

  <!-- Navegação por Abas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('caixa')">💵 Movimentação de Caixa</button>
    <button class="tab-btn" onclick="switchTab('jogadores')">👤 Cadastro de Jogadores</button>
  </div>

  <!-- ABA 1: CAIXA -->
  <div id="tab-caixa" class="tab-content active">
    <div class="summary-cards">
      <div class="card">
        <h4>Caixa Líquido (Entradas - Saídas)</h4>
        <div class="val val-caixa" id="totalEntradas">R$ 0,00</div>
      </div>
      <div class="card">
        <h4>Total Pendente (Vales Abertos)</h4>
        <div class="val val-vale" id="totalVales">R$ 0,00</div>
      </div>
    </div>

    <div class="search-box">
      <label>🔍 <b>Consultar Dívida por Jogador:</b></label>
      <select id="searchPlayer" onchange="calculatePlayerDebt()">
        <option value="">-- Selecione o Jogador --</option>
      </select>
      <div class="search-result" id="playerDebtResult">Devendo: R$ 0,00</div>
    </div>

    <div class="top-actions">
      <button class="btn-print-all" onclick="printAll()">🖨️ Imprimir Relatório Geral</button>
    </div>

    <form id="pokerForm">
      <select id="playerSelect" required>
        <option value="">Selecione o Jogador</option>
      </select>
      
      <select id="method">
        <option value="PIX">📱 PIX (Entrada)</option>
        <option value="DINHEIRO">💵 Dinheiro (Entrada)</option>
        <option value="CARTAO">💳 Cartão (Entrada)</option>
        <option value="VALE">📝 Vale / Pegou Ficha (Dívida)</option>
        <option value="PAGAR_VALE">💚 Pagar Vale em Dinheiro/PIX</option>
        <option value="DEVOLUCAO">🔄 Devolução de Ficha (Abater Vale / Saída)</option>
      </select>

      <input type="number" id="amount" step="0.01" placeholder="Valor (R$)" required>
      <input type="text" id="desc" placeholder="Obs ex: Dev. 100 em fichas">
      <button type="submit">Lançar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Jogador</th>
          <th>Forma</th>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ABA 2: CADASTRO DE JOGADORES -->
  <div id="tab-jogadores" class="tab-content">
    <h3 id="playerFormTitle">Novo Jogador</h3>
    <form id="playerForm">
      <input type="hidden" id="editPlayerId">
      <input type="text" id="newPlayerName" placeholder="Nome Completo" required>
      <input type="text" id="newPlayerPhone" placeholder="Telefone / WhatsApp">
      <input type="text" id="newPlayerPix" placeholder="Chave PIX">
      <input type="date" id="newPlayerBirth" title="Data de Nascimento">
      <button type="submit" id="btnSavePlayer">Salvar Jogador</button>
      <button type="button" class="btn-cancel" id="btnCancelEdit" onclick="cancelPlayerEdit()">Cancelar</button>
    </form>

    <h3 style="margin-top:20px;">Jogadores Cadastrados</h3>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>Chave PIX</th>
          <th>Nascimento</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="playerTableBody"></tbody>
    </table>
  </div>

  <div id="print-area"></div>

  <script>
    // Gerenciamento de Abas
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'caixa') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-caixa').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-jogadores').classList.add('active');
      }
    }

    // Carregamento Inicial
    document.addEventListener('DOMContentLoaded', () => {
      loadPlayers();
      loadData();
    });

    // LÓGICA DE JOGADORES
    const playerForm = document.getElementById('playerForm');
    const playerTableBody = document.getElementById('playerTableBody');

    playerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const editId = document.getElementById('editPlayerId').value;
      const name = document.getElementById('newPlayerName').value.trim();
      const phone = document.getElementById('newPlayerPhone').value.trim() || '-';
      const pix = document.getElementById('newPlayerPix').value.trim() || '-';
      const birth = document.getElementById('newPlayerBirth').value || '';

      let players = JSON.parse(localStorage.getItem('poker_players')) || [];

      if (editId) {
        // Atualização de Jogador Existente
        const index = players.findIndex(p => p.id == editId);
        if (index !== -1) {
          players[index] = { id: Number(editId), name, phone, pix, birth };
        }
      } else {
        // Novo Cadastro
        if (players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
          alert('Este jogador já está cadastrado!');
          return;
        }
        players.push({ id: Date.now(), name, phone, pix, birth });
      }

      localStorage.setItem('poker_players', JSON.stringify(players));
      cancelPlayerEdit();
      loadPlayers();
      loadData();
    });

    function loadPlayers() {
      const players = JSON.parse(localStorage.getItem('poker_players')) || [];
      playerTableBody.innerHTML = '';

      const playerSelect = document.getElementById('playerSelect');
      const searchPlayerSelect = document.getElementById('searchPlayer');

      playerSelect.innerHTML = '<option value="">Selecione o Jogador</option>';
      searchPlayerSelect.innerHTML = '<option value="">-- Selecione o Jogador --</option>';

      players.sort((a, b) => a.name.localeCompare(b.name)).forEach(p => {
        let birthFormatted = '-';
        if (p.birth) {
          const parts = p.birth.split('-');
          if (parts.length === 3) birthFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td><b>${p.name}</b></td>
          <td>${p.phone}</td>
          <td>${p.pix || '-'}</td>
          <td>${birthFormatted}</td>
          <td style="white-space:nowrap;">
            <button class="btn-edit" onclick="editPlayer(${p.id})">✏️ Editar</button>
            <button class="btn-del" onclick="deletePlayer(${p.id})">X</button>
          </td>
        `;
        playerTableBody.appendChild(row);

        playerSelect.innerHTML += `<option value="${p.name}">${p.name}</option>`;
        searchPlayerSelect.innerHTML += `<option value="${p.name}">${p.name}</option>`;
      });
    }

    function editPlayer(id) {
      const players = JSON.parse(localStorage.getItem('poker_players')) || [];
      const p = players.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editPlayerId').value = p.id;
      document.getElementById('newPlayerName').value = p.name;
      document.getElementById('newPlayerPhone').value = p.phone === '-' ? '' : p.phone;
      document.getElementById('newPlayerPix').value = p.pix === '-' ? '' : (p.pix || '');
      document.getElementById('newPlayerBirth').value = p.birth || '';

      document.getElementById('playerFormTitle').innerText = '✏️ Editar Jogador';
      document.getElementById('btnSavePlayer').innerText = 'Atualizar Jogador';
      document.getElementById('btnCancelEdit').style.display = 'inline-block';
    }

    function cancelPlayerEdit() {
      document.getElementById('editPlayerId').value = '';
      playerForm.reset();
      document.getElementById('playerFormTitle').innerText = 'Novo Jogador';
      document.getElementById('btnSavePlayer').innerText = 'Salvar Jogador';
      document.getElementById('btnCancelEdit').style.display = 'none';
    }

    function deletePlayer(id) {
      if (!confirm('Tem certeza de que deseja excluir este jogador?')) return;
      let players = JSON.parse(localStorage.getItem('poker_players')) || [];
      players = players.filter(p => p.id !== id);
      localStorage.setItem('poker_players', JSON.stringify(players));
      loadPlayers();
    }

    // LÓGICA DO CAIXA
    const form = document.getElementById('pokerForm');
    const tableBody = document.getElementById('tableBody');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('playerSelect').value;
      const method = document.getElementById('method').value;
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const desc = document.getElementById('desc').value.trim() || '-';
      const date = new Date().toLocaleString('pt-BR');

      if (!name) {
        alert('Por favor, selecione um jogador.');
        return;
      }

      const transactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
      transactions.unshift({ id: Date.now(), date, name, method, amount, desc });

      localStorage.setItem('poker_txs', JSON.stringify(transactions));
      form.reset();
      loadData();
    });

    function loadData() {
      const transactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
      tableBody.innerHTML = '';

      const txsCronologicas = [...transactions].reverse();

      let totalEntradasBrutas = 0;
      let totalSaidasCaixa = 0;
      const playerVales = {};

      txsCronologicas.forEach(tx => {
        if (!playerVales[tx.name]) playerVales[tx.name] = 0;

        if (tx.method === 'DINHEIRO' || tx.method === 'CARTAO' || tx.method === 'PIX' || tx.method === 'PAGAR_VALE') {
          totalEntradasBrutas += tx.amount;
        }

        if (tx.method === 'VALE') {
          playerVales[tx.name] += tx.amount;
        } else if (tx.method === 'PAGAR_VALE') {
          playerVales[tx.name] = Math.max(0, playerVales[tx.name] - tx.amount);
        } else if (tx.method === 'DEVOLUCAO') {
          const valeAtual = playerVales[tx.name];
          if (tx.amount <= valeAtual) {
            playerVales[tx.name] -= tx.amount;
          } else {
            const excedente = tx.amount - valeAtual;
            playerVales[tx.name] = 0;
            totalSaidasCaixa += excedente;
          }
        }
      });

      transactions.forEach(tx => {
        let methodClass = 'badge-vale';
        let labelText = tx.method;

        if (tx.method === 'DINHEIRO' || tx.method === 'CARTAO' || tx.method === 'PIX') {
          if (tx.method === 'DINHEIRO') methodClass = 'badge-dinheiro';
          if (tx.method === 'CARTAO') methodClass = 'badge-cartao';
          if (tx.method === 'PIX') methodClass = 'badge-pix';
        } else if (tx.method === 'VALE') {
          methodClass = 'badge-vale';
        } else if (tx.method === 'PAGAR_VALE') {
          methodClass = 'badge-paga-vale';
          labelText = 'PAGOU VALE';
        } else if (tx.method === 'DEVOLUCAO') {
          methodClass = 'badge-devolucao';
          labelText = 'DEV. FICHA';
        }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="font-size:0.8rem;">${tx.date}</td>
          <td><b>${tx.name}</b></td>
          <td class="${methodClass}">${labelText}</td>
          <td>${tx.desc}</td>
          <td>R$ ${tx.amount.toFixed(2)}</td>
          <td style="white-space:nowrap;">
            <button class="btn-print-row" onclick="printSingle(${tx.id})">🖨️ Imprimir</button>
            <button class="btn-del" onclick="deleteTx(${tx.id})">X</button>
          </td>
        `;
        tableBody.appendChild(row);
      });

      const totalValesPendentes = Object.values(playerVales).reduce((acc, val) => acc + val, 0);
      const caixaLiquido = totalEntradasBrutas - totalSaidasCaixa;

      document.getElementById('totalEntradas').innerText = `R$ ${caixaLiquido.toFixed(2)}`;
      document.getElementById('totalVales').innerText = `R$ ${totalValesPendentes.toFixed(2)}`;
      
      calculatePlayerDebt();
    }

    function calculatePlayerDebt() {
      const selectedPlayer = document.getElementById('searchPlayer').value;
      const resultDiv = document.getElementById('playerDebtResult');

      if (!selectedPlayer) {
        resultDiv.innerText = 'Devendo: R$ 0,00';
        return;
      }

      const transactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
      let debt = 0;

      [...transactions].reverse().forEach(t => {
        if (t.name === selectedPlayer) {
          if (t.method === 'VALE') debt += t.amount;
          if (t.method === 'PAGAR_VALE' || t.method === 'DEVOLUCAO') debt -= t.amount;
        }
      });

      if (debt < 0) {
        resultDiv.innerText = `Crédito (A Pagar ao Jogador): R$ ${Math.abs(debt).toFixed(2)}`;
      } else {
        resultDiv.innerText = `Devendo em Vales: R$ ${debt.toFixed(2)}`;
      }
    }

    function deleteTx(id) {
      let transactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
      const tx = transactions.find(t => t.id === id);
      
      const confirmMessage = tx 
        ? `Tem certeza de que deseja excluir o lançamento de R$ ${tx.amount.toFixed(2)} do jogador ${tx.name}?`
        : 'Tem certeza de que deseja excluir este lançamento?';

      if (!confirm(confirmMessage)) return;

      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('poker_txs', JSON.stringify(transactions));
      loadData();
    }

    function printSingle(id) {
      const transactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
      const tx = transactions.find(t => t.id === id);
      if (!tx) return;

      const printArea = document.getElementById('print-area');
      let methodText = tx.method;
      if (tx.method === 'PAGAR_VALE') methodText = 'PAGAMENTO DE VALE';
      if (tx.method === 'DEVOLUCAO') methodText = 'DEVOLUCAO DE FICHA';

      printArea.innerHTML = `
        <div class="ticket">
          <h2>POKER CLUB</h2>
          <h3>COMPROVANTE</h3>
          <div class="line"></div>
          <div class="ticket-row"><span>DATA:</span> <span>${tx.date}</span></div>
          <div class="ticket-row"><span>JOGADOR:</span> <span><b>${tx.name.toUpperCase()}</b></span></div>
          <div class="ticket-row"><span>TIPO:</span> <span><b>${methodText}</b></span></div>
          <div class="ticket-row"><span>OBS:</span> <span>${tx.desc}</span></div>
          <div class="valor-destaque">
            VALOR: R$ ${tx.amount.toFixed(2)}
          </div>
          <div class="line"></div>
          <br><br>
          <p>___________________________________</p>
          <p>Assinatura do Cliente</p>
          <div class="cut-space"></div>
        </div>
      `;
      window.print();
    }

    function printAll() {
      const transactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
      const printArea = document.getElementById('print-area');

      let html = `
        <div class="ticket">
          <h2>POKER CLUB</h2>
          <h3>RELATÓRIO GERAL</h3>
          <p>${new Date().toLocaleString('pt-BR')}</p>
          <div class="line"></div>
      `;

      let totalPix = 0, totalDinheiro = 0, totalCartao = 0, totalVale = 0, totalPagoVale = 0, totalDevolucao = 0;

      transactions.forEach(t => {
        if (t.method === 'PIX') totalPix += t.amount;
        if (t.method === 'DINHEIRO') totalDinheiro += t.amount;
        if (t.method === 'CARTAO') totalCartao += t.amount;
        if (t.method === 'VALE') totalVale += t.amount;
        if (t.method === 'PAGAR_VALE') totalPagoVale += t.amount;
        if (t.method === 'DEVOLUCAO') totalDevolucao += t.amount;

        let labelText = t.method;
        if (t.method === 'PAGAR_VALE') labelText = 'PAGOU VALE';
        if (t.method === 'DEVOLUCAO') labelText = 'DEV. FICHA';

        html += `
          <div class="ticket-row">
            <span>${t.name.toUpperCase()} (${labelText})</span>
            <span>R$ ${t.amount.toFixed(2)}</span>
          </div>
        `;
      });

      const txsCronologicas = [...transactions].reverse();
      let saídasReais = 0;
      const playerVales = {};

      txsCronologicas.forEach(tx => {
        if (!playerVales[tx.name]) playerVales[tx.name] = 0;
        if (tx.method === 'VALE') playerVales[tx.name] += tx.amount;
        if (tx.method === 'PAGAR_VALE') playerVales[tx.name] = Math.max(0, playerVales[tx.name] - tx.amount);
        if (tx.method === 'DEVOLUCAO') {
          const v = playerVales[tx.name];
          if (tx.amount > v) {
            saídasReais += (tx.amount - v);
            playerVales[tx.name] = 0;
          } else {
            playerVales[tx.name] -= tx.amount;
          }
        }
      });

      const totalValesAbertos = Object.values(playerVales).reduce((acc, v) => acc + v, 0);
      const entradasTotais = totalPix + totalDinheiro + totalCartao + totalPagoVale;
      const caixaFinal = entradasTotais - saídasReais;

      html += `
        <div class="line"></div>
        <div class="ticket-row"><span>ENTRADAS PIX:</span> <span>R$ ${totalPix.toFixed(2)}</span></div>
        <div class="ticket-row"><span>ENTRADAS DINHEIRO:</span> <span>R$ ${totalDinheiro.toFixed(2)}</span></div>
        <div class="ticket-row"><span>ENTRADAS CARTÃO:</span> <span>R$ ${totalCartao.toFixed(2)}</span></div>
        <div class="ticket-row"><span>VALES QUITADOS:</span> <span>R$ ${totalPagoVale.toFixed(2)}</span></div>
        <div class="ticket-row"><span>TOTAL DEVOLUÇÃO FICHAS:</span> <span>R$ ${totalDevolucao.toFixed(2)}</span></div>
        <div class="ticket-row"><span>SAÍDAS REAIS DE CAIXA:</span> <span>- R$ ${saídasReais.toFixed(2)}</span></div>
        <div class="ticket-row"><span>VALES EM ABERTO:</span> <span>R$ ${totalValesAbertos.toFixed(2)}</span></div>
        <div class="line"></div>
        <div class="ticket-row"><span>CAIXA LÍQUIDO FINAL:</span> <span>R$ ${caixaFinal.toFixed(2)}</span></div>
        <div class="cut-space"></div>
        </div>
      `;

      printArea.innerHTML = html;
      window.print();
    }
  </script>
</body>
</html>
