<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tianchi Poker - Gestão de Caixa</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 15px; }

    /* LAYOUT BASE */
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }

    /* LOGIN OVERLAY */
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 999;
    }
    .login-card {
      background: var(--card); padding: 30px; border-radius: 12px;
      border: 1px solid var(--border); width: 100%; max-width: 350px; text-align: center;
    }

    /* FORMS & INPUTS */
    input, select, button {
      width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px;
      border: 1px solid var(--border); background: #0f172a; color: #fff; font-size: 1rem;
    }
    button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }

    /* CARDS & TABS */
    .card { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); margin: 0; }
    .tab-btn.active { background: var(--accent); color: #000; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* TABELAS */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.9rem; }
    th { background: #0f172a; color: var(--accent); }

    /* TICKET IMPRESSÃO */
    #print-area { display: none; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { display: block; position: absolute; left: 0; top: 0; width: 80mm; font-family: monospace; }
      .ticket { font-size: 12px; width: 100%; padding: 5px; }
      .line { border-top: 1px dashed #000; margin: 5px 0; }
      .ticket-row { display: flex; justify-content: space-between; margin: 3px 0; }
      .cut-space { height: 30px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN FECHADO (APENAS PARA A EQUIPE) -->
  <div id="login-overlay">
    <div class="login-card">
      <h2>♣ TIANCHI 🌐</h2>
      <p style="font-size: 0.85rem; color:#aaa;">Autenticação do Caixa</p>
      <input type="text" id="loginUser" placeholder="Nome de Usuário">
      <input type="password" id="loginPass" placeholder="Senha de Acesso">
      <button onclick="login()">Entrar no Sistema</button>
    </div>
  </div>

  <!-- SISTEMA PRINCIPAL -->
  <div class="container">
    <header>
      <h1>♣ TIANCHI POKER</h1>
      <div>
        <span id="userDisplay" style="font-weight: bold; font-size: 0.9rem; margin-right: 10px;"></span>
        <button onclick="logout()" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" class="btn-danger">Sair</button>
      </div>
    </header>

    <!-- NAVEGAÇÃO ENTRE ABAS -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('caixa')">💵 Lançamentos de Caixa</button>
      <button class="tab-btn" onclick="switchTab('relatorio')">📄 Fechamento / Imprimir</button>
    </div>

    <!-- ABA 1: CAIXA / OPERAÇÕES -->
    <div id="tab-caixa" class="tab-content active card">
      <h3>Nova Operação</h3>
      <form id="txForm">
        <input type="text" id="txName" placeholder="Nome do Jogador / Descrição" required>
        <select id="txMethod" required>
          <option value="PIX">PIX</option>
          <option value="DINHEIRO">Dinheiro</option>
          <option value="CARTAO">Cartão de Crédito/Débito</option>
          <option value="VALE">Vale (Ficha Fiada)</option>
          <option value="PAGAR_VALE">Pagamento de Vale</option>
          <option value="RAKE">Rake da Casa</option>
          <option value="DESPESA">Retirada / Despesa</option>
          <option value="DEVOLUCAO">Devolução de Fichas (Saída)</option>
        </select>
        <input type="number" id="txAmount" step="0.01" placeholder="Valor (R$)" required>
        <button type="submit" class="btn-success">Confirmar Operação</button>
      </form>

      <h3 style="margin-top: 25px;">Operações Recentes</h3>
      <table>
        <thead>
          <tr>
            <th>Horário</th>
            <th>Descrição</th>
            <th>Método</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody id="txTableBody"></tbody>
      </table>
    </div>

    <!-- ABA 2: FECHAMENTO / IMPRESSÃO -->
    <div id="tab-relatorio" class="tab-content card">
      <h3>Fechamento de Caixa</h3>
      <p>Clique abaixo para gerar a visualização das operações e imprimir o cupom térmico de fechamento.</p>
      
      <div style="margin-bottom: 15px;">
        <label>Filtrar por Sessão:</label>
        <select id="filterSession" style="margin-top: 5px;">
          <option value="todas">Todas as Operações Registradas</option>
          <option value="atual" selected>Sessão Atual</option>
        </select>
      </div>

      <button onclick="printAll()" class="btn-success">🖨️ Imprimir Fechamento Completo</button>
    </div>
  </div>

  <!-- AREA RESERVADA PARA IMPRESSÃO DO CUPOM -->
  <div id="print-area"></div>

  <script>
    // CONFIGURAÇÃO SUPABASE (URL Corrigida)
    const SUPABASE_URL = 'https://jmixkymwdbtbrihxoigk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptaXhreW13ZGJ0YnJpaHhvaWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTUyMzQsImV4cCI6MjEwMjkzMTIzNH0.4T8EVhYR9X0bTBI99H-VszMupJhHy2-p3ToXtB2iErM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let currentSession = null;
    let globalTransactions = [];

    // NAVEGAÇÃO DE ABAS
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // AUTENTICAÇÃO DE USUÁRIO
    async function login() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();

      if (!u || !p) {
        alert('Informe o usuário e a senha para acessar.');
        return;
      }

      const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('username', u)
        .eq('password', p)
        .maybeSingle();

      if (error) {
        alert('Erro ao consultar banco de dados: ' + error.message);
      } else if (!data) {
        alert('Usuário ou senha incorretos.');
      } else {
        currentUser = data;
        document.getElementById('userDisplay').innerText = `Op: ${currentUser.username.toUpperCase()}`;
        document.getElementById('login-overlay').style.display = 'none';
        syncAll();
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('login-overlay').style.display = 'flex';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }

    // BUSCA E ATUALIZAÇÃO DE DADOS
    async function syncAll() {
      const { data: txs } = await supabaseClient
        .from('transactions')
        .select('*')
        .order('created_at', { ascending: false });

      globalTransactions = txs || [];
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('txTableBody');
      tbody.innerHTML = '';

      globalTransactions.forEach(t => {
        const date = new Date(t.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        tbody.innerHTML += `
          <tr>
            <td>${date}</td>
            <td><b>${t.name.toUpperCase()}</b></td>
            <td>${t.method}</td>
            <td>R$ ${Number(t.amount).toFixed(2)}</td>
          </tr>
        `;
      });
    }

    // REGISTRO DE NOVA OPERAÇÃO
    document.getElementById('txForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('txName').value.trim();
      const method = document.getElementById('txMethod').value;
      const amount = parseFloat(document.getElementById('txAmount').value);

      const { error } = await supabaseClient.from('transactions').insert([{
        name,
        method,
        amount,
        user_id: currentUser ? currentUser.id : null
      }]);

      if (error) {
        alert('Erro ao salvar operação: ' + error.message);
      } else {
        document.getElementById('txForm').reset();
        syncAll();
      }
    });

    // FUNÇÃO DE IMPRESSÃO - COM DETALHAMENTO DE OPERAÇÕES
    function printAll() {
      const printArea = document.getElementById('print-area');
      let txs = [...globalTransactions];

      if (txs.length === 0) {
        alert('Nenhuma operação cadastrada no momento para emissão do relatório.');
        return;
      }

      let html = `
        <div class="ticket">
          <h2 style="text-align:center; margin:0;">TIANCHI POKER</h2>
          <h3 style="text-align:center; margin:2px 0;">RELATÓRIO DE FECHAMENTO</h3>
          <p style="text-align:center; font-size:0.75rem; margin:0;">Emissão: ${new Date().toLocaleString('pt-BR')}</p>
          <div class="line"></div>
          <p style="margin: 4px 0; text-align:center;"><b>DETALHAMENTO DAS OPERAÇÕES</b></p>
          <div class="line"></div>
      `;

      let totalPix = 0;
      let totalDinheiro = 0;
      let totalCartao = 0;
      let totalVale = 0;
      let totalPagoVale = 0;
      let totalRake = 0;
      let totalDespesas = 0;
      let totalDevolucao = 0;

      // Percorre e imprime cada lançamento
      txs.forEach(t => {
        const val = Number(t.amount);
        
        if (t.method === 'PIX') totalPix += val;
        if (t.method === 'DINHEIRO') totalDinheiro += val;
        if (t.method === 'CARTAO') totalCartao += val;
        if (t.method === 'VALE') totalVale += val;
        if (t.method === 'PAGAR_VALE') totalPagoVale += val;
        if (t.method === 'RAKE') totalRake += val;
        if (t.method === 'DESPESA') totalDespesas += val;
        if (t.method === 'DEVOLUCAO') totalDevolucao += val;

        let label = t.method;
        if (t.method === 'PAGAR_VALE') label = 'PAGOU VALE';
        if (t.method === 'DEVOLUCAO') label = 'DEV. FICHA';
        if (t.method === 'RAKE') label = 'RAKE CASA';

        html += `
          <div class="ticket-row" style="font-size: 0.8rem;">
            <span>${t.name.toUpperCase()} (${label})</span>
            <span>R$ ${val.toFixed(2)}</span>
          </div>
        `;
      });

      const totalEntradas = totalPix + totalDinheiro + totalCartao + totalPagoVale + totalRake;
      const caixaFinal = totalEntradas - (totalDespesas + totalDevolucao);

      // Resumo Consolidado
      html += `
        <div class="line"></div>
        <p style="margin: 4px 0; text-align:center;"><b>RESUMO FINANCEIRO</b></p>
        <div class="line"></div>
        <div class="ticket-row"><span>ENTRADAS PIX:</span> <span>R$ ${totalPix.toFixed(2)}</span></div>
        <div class="ticket-row"><span>ENTRADAS DINHEIRO:</span> <span>R$ ${totalDinheiro.toFixed(2)}</span></div>
        <div class="ticket-row"><span>ENTRADAS CARTÃO:</span> <span>R$ ${totalCartao.toFixed(2)}</span></div>
        <div class="ticket-row"><span>VALES QUITADOS:</span> <span>R$ ${totalPagoVale.toFixed(2)}</span></div>
        <div class="ticket-row"><span>RAKE DA CASA:</span> <span>R$ ${totalRake.toFixed(2)}</span></div>
        <div class="ticket-row"><span>DEV. FICHAS (SAÍDA):</span> <span>- R$ ${totalDevolucao.toFixed(2)}</span></div>
        <div class="ticket-row"><span>RETIRADA DESPESAS:</span> <span>- R$ ${totalDespesas.toFixed(2)}</span></div>
        <div class="line"></div>
        <div class="ticket-row" style="font-size:1.05rem;"><span><b>CAIXA LÍQUIDO:</b></span> <span><b>R$ ${caixaFinal.toFixed(2)}</b></span></div>
        <div class="cut-space"></div>
        </div>
      `;

      printArea.innerHTML = html;
      window.print();
    }
  </script>
</body>
</html>
