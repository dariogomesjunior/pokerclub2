<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciamento de Caixa - Poker Club</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #2e7d32;
      --border-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .card h3 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: #aaa;
    }

    .card .value {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .form-container, .table-container {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      margin-bottom: 5px;
    }

    input, select, button {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: #2a2a2a;
      color: #fff;
    }

    button.btn-add {
      background-color: var(--accent-color);
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }

    button.btn-add:hover {
      background-color: #388e3c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #252525;
    }

    .badge-dinheiro { background: #1b5e20; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-cartao { background: #0d47a1; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-pix { background: #4a148c; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-vale { background: #b71c1c; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-paga-vale { background: #e65100; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-devolucao { background: #006064; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-despesa { background: #880e4f; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-rake { background: #f57f17; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }

    .btn-del, .btn-edit {
      border: none;
      padding: 5px 8px;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-del { background: #c62828; }
    .btn-edit { background: #1565c0; }

    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Sistema de Caixa - Poker Club</h2>

    <!-- Dashboard -->
    <div class="dashboard">
      <div class="card">
        <h3>Caixa Líquido</h3>
        <div class="value" id="totalEntradas">R$ 0.00</div>
      </div>
      <div class="card">
        <h3>Total Rake (Casa)</h3>
        <div class="value" id="totalRake">R$ 0.00</div>
      </div>
      <div class="card">
        <h3>Vales Pendentes</h3>
        <div class="value" id="totalVales">R$ 0.00</div>
      </div>
    </div>

    <!-- Formulário de Transação -->
    <div class="form-container">
      <h3>Novo Lançamento</h3>
      <form id="txForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Jogador / Destino</label>
            <input type="text" id="txName" required placeholder="Nome do jogador">
          </div>
          <div class="form-group">
            <label>Tipo de Método</label>
            <select id="txMethod">
              <option value="DINHEIRO">Dinheiro</option>
              <option value="PIX">PIX</option>
              <option value="CARTAO">Cartão</option>
              <option value="VALE">Vale (Ficha fiado)</option>
              <option value="PAGAR_VALE">Pagamento de Vale</option>
              <option value="DEVOLUCAO">Devolução de Ficha</option>
              <option value="RAKE">Rake da Casa</option>
              <option value="DESPESA">Despesa</option>
            </select>
          </div>
          <div class="form-group">
            <label>Valor (R$)</label>
            <input type="number" step="0.01" id="txAmount" required placeholder="0.00">
          </div>
          <div class="form-group">
            <label>Observação</label>
            <input type="text" id="txObs" placeholder="Ex: Mesa 1, Rebuy, etc.">
          </div>
          <button type="submit" class="btn-add">Adicionar</button>
        </div>
      </form>
    </div>

    <!-- Tabela de Transações -->
    <div class="table-container">
      <h3>Histórico de Transações</h3>
      
      <div class="filters">
        <input type="text" id="filterTablePlayer" placeholder="Filtrar por nome..." oninput="renderTable()">
        <select id="filterSession" onchange="renderTable()">
          <option value="todas">Todas as Sessões</option>
          <option value="atual" selected>Sessão Atual</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Nome</th>
            <th>Método</th>
            <th>Obs</th>
            <th>Valor</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let globalTransactions = JSON.parse(localStorage.getItem('poker_txs')) || [];
    let currentSession = { id: 1 }; // Exemplo de sessão ativa ID 1

    document.getElementById('txForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const newTx = {
        id: Date.now(),
        session_id: currentSession.id,
        date: new Date().toLocaleString('pt-BR'),
        name: document.getElementById('txName').value.trim(),
        method: document.getElementById('txMethod').value,
        amount: parseFloat(document.getElementById('txAmount').value),
        desc_obs: document.getElementById('txObs').value
      };

      globalTransactions.push(newTx);
      saveAndRender();
      this.reset();
    });

    function deleteTx(id) {
      if (confirm("Deseja realmente excluir esta transação?")) {
        globalTransactions = globalTransactions.filter(t => t.id !== id);
        saveAndRender();
      }
    }

    function printSingle(id) {
      const tx = globalTransactions.find(t => t.id === id);
      if (tx) {
        alert(`Imprimindo Comprovante:\n\nID: ${tx.id}\nNome: ${tx.name}\nTipo: ${tx.method}\nValor: R$ ${tx.amount.toFixed(2)}\nData: ${tx.date}`);
      }
    }

    function saveAndRender() {
      localStorage.setItem('poker_txs', JSON.stringify(globalTransactions));
      renderTable();
    }

    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      const filterPlayer = document.getElementById('filterTablePlayer').value.toLowerCase();
      const filterSession = document.getElementById('filterSession').value;

      tableBody.innerHTML = '';

      let txs = [...globalTransactions];

      if (filterSession === 'atual' && currentSession) {
        txs = txs.filter(t => t.session_id === currentSession.id);
      }

      if (filterPlayer) {
        txs = txs.filter(t => t.name.toLowerCase().includes(filterPlayer));
      }

      let totalEntradasBrutas = 0;
      let totalSaidasCaixa = 0;
      let totalRakeTotal = 0;
      const playerVales = {};

      // 1. Processa em ordem CRONOLÓGICA (do ID mais antigo para o mais novo) para calcular os saldos corretamente
      const txsCronologicas = [...txs].sort((a, b) => a.id - b.id);

      txsCronologicas.forEach(tx => {
        const val = Number(tx.amount);
        if (!playerVales[tx.name]) playerVales[tx.name] = 0;

        // Entradas reais de dinheiro no caixa
        if (['DINHEIRO', 'CARTAO', 'PIX', 'PAGAR_VALE'].includes(tx.method)) {
          totalEntradasBrutas += val;
        }

        // Rake arrecadado pela casa
        if (tx.method === 'RAKE') {
          totalRakeTotal += val;
          totalEntradasBrutas += val;
        }

        // Despesas operacionais do clube
        if (tx.method === 'DESPESA') {
          totalSaidasCaixa += val;
        }

        // Gestão de Vales (Fiado)
        if (tx.method === 'VALE') {
          playerVales[tx.name] += val;
        }

        if (tx.method === 'PAGAR_VALE') {
          playerVales[tx.name] = Math.max(0, playerVales[tx.name] - val);
        }

        // Devolução de Fichas (Cashout)
        if (tx.method === 'DEVOLUCAO') {
          const valeAtual = playerVales[tx.name] || 0;
          if (val <= valeAtual) {
            // Abate do vale pendente sem sair dinheiro físico do caixa
            playerVales[tx.name] -= val;
          } else {
            // Paga o vale pendente e a diferença é paga em dinheiro ao jogador (Saída do Caixa)
            totalSaidasCaixa += (val - valeAtual);
            playerVales[tx.name] = 0;
          }
        }
      });

      // 2. Renderiza na tabela do MAIS RECENTE para o MAIS ANTIGO
      const txsExibicao = [...txs].reverse();

      txsExibicao.forEach(tx => {
        let methodClass = 'badge-vale';
        let labelText = tx.method;

        if (tx.method === 'DINHEIRO') methodClass = 'badge-dinheiro';
        if (tx.method === 'CARTAO') methodClass = 'badge-cartao';
        if (tx.method === 'PIX') methodClass = 'badge-pix';
        if (tx.method === 'PAGAR_VALE') { methodClass = 'badge-paga-vale'; labelText = 'PAGOU VALE'; }
        if (tx.method === 'DEVOLUCAO') { methodClass = 'badge-devolucao'; labelText = 'DEV. FICHA'; }
        if (tx.method === 'DESPESA') { methodClass = 'badge-despesa'; labelText = 'DESPESA'; }
        if (tx.method === 'RAKE') { methodClass = 'badge-rake'; labelText = 'RAKE CASA'; }

        const row = document.createElement('tr');
        row.innerHTML = `
          <td style="font-size:0.8rem;">${tx.date}</td>
          <td><b>${tx.name}</b></td>
          <td><span class="${methodClass}">${labelText}</span></td>
          <td>${tx.desc_obs || '-'}</td>
          <td>R$ ${Number(tx.amount).toFixed(2)}</td>
          <td style="white-space:nowrap;">
            <button class="btn-edit" onclick="printSingle(${tx.id})">🖨️</button>
            <button class="btn-del" onclick="deleteTx(${tx.id})">X</button>
          </td>
        `;
        tableBody.appendChild(row);
      });

      const totalValesPendentes = Object.values(playerVales).reduce((acc, val) => acc + val, 0);
      const caixaLiquido = totalEntradasBrutas - totalSaidasCaixa;

      document.getElementById('totalEntradas').innerText = `R$ ${caixaLiquido.toFixed(2)}`;
      document.getElementById('totalRake').innerText = `R$ ${totalRakeTotal.toFixed(2)}`;
      document.getElementById('totalVales').innerText = `R$ ${totalValesPendentes.toFixed(2)}`;
    }

    // Inicialização da tela
    renderTable();
  </script>
</body>
</html>
